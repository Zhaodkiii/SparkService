server {
    listen 127.0.0.1:${FRONTEND_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location ^~ /api/v1/material-sync/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:${DJANGO_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:${DJANGO_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /public-assets/ {
        alias /usr/share/nginx/html/public/public-assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /invite/ { try_files /public/index.html =404; }
    location = /download { try_files /public/index.html =404; }
    location ^~ /experience/ { try_files /public/index.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

