server {
    listen 80;
    listen [::]:80;
    server_name diary.dreamwhale.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name diary.dreamwhale.top;
    ssl_certificate /etc/letsencrypt/live/diary.dreamwhale.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diary.dreamwhale.top/privkey.pem;
    client_max_body_size 100m;
    location /api/ {
        proxy_pass http://127.0.0.1:12026;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:12026;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:12018;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
